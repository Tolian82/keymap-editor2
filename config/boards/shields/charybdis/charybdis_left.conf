
# 旋钮配置
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE
CONFIG_ZMK_POINTING=y

# DIAGNOSTIC ONLY: CDC ACM serial logs over the LEFT USB cable.
# Log EC11 quadrature transitions without changing sensor pins/bindings/logic.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
